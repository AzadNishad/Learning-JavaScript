<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        .choices {
            margin-bottom: 20px;
        }

        .choice {
            cursor: pointer;
            font-size: 60px;
            background: none;
            border: none;
            transition: ease-in-out;
        }

        .choice:nth-child(2) {
            margin: 50px;
        }

        .choice:hover {
            text-shadow: 1px 1px 5px;
        }

        #result {
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Rock Paper Scissors</h1>
        <div class="choices">
            <button class="choice" onclick="playGame('rock')">✊</button>
            <button class="choice" onclick="playGame('paper')">🖐️</button>
            <button class="choice" onclick="playGame('scissors')">✌️</button>
        </div>
        <div id="result"></div>
    </div>

    <script>
        function playGame(playerChoice) {
            const choices = ['rock', 'paper', 'scissors'];
            const computerChoice = choices[Math.floor(Math.random() * choices.length)];

            let result;

            if (playerChoice === computerChoice) {
                result = "It's a tie!";
            } else if (
                (playerChoice === 'rock' && computerChoice === 'scissors') ||
                (playerChoice === 'paper' && computerChoice === 'rock') ||
                (playerChoice === 'scissors' && computerChoice === 'paper')
            ) {
                result = "You win! 🎉🎉";
            } else {
                result = "You lose! 😢😢";
            }

            document.getElementById('result').innerHTML = `You chose ${playerChoice}. Computer chose ${computerChoice}.<br><br> <h2> ${result}. </h2>`;
        }

    </script>
</body>

</html>
