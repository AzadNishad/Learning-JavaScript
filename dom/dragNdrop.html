<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container-wrapper {
            display: flex;
            gap: 3rem;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .drop-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 2rem;
            min-height: 400px;
            width: 350px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 2px dashed transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .drop-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            border-radius: 20px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .drop-container.drag-over {
            border-color: #4ecdc4;
            transform: scale(1.02);
            box-shadow: 0 25px 50px rgba(78, 205, 196, 0.3);
        }

        .drop-container.drag-over::before {
            opacity: 1;
        }

        .container-header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .container-title {
            font-size: 1.3rem;
            color: #333;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .container-subtitle {
            color: #666;
            font-size: 0.9rem;
        }

        .items-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        }

        .drag-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            cursor: grab;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .drag-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease-in-out;
        }

        .drag-item:hover::before {
            left: 100%;
        }

        .drag-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .drag-item:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .drag-item.dragging {
            opacity: 0.5;
            transform: rotate(5deg);
        }

        .item-icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .empty-state {
            text-align: center;
            color: #999;
            font-style: italic;
            padding: 2rem;
            border: 2px dashed #ddd;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.02);
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .stats {
            margin-top: 2rem;
            text-align: center;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        @media (max-width: 768px) {
            .container-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 2rem;
            }

            .drop-container {
                width: 100%;
                max-width: 400px;
            }

            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Drag & Drop Interface</h1>
        <p>Move items between containers with smooth interactions</p>
    </div>

    <div class="container-wrapper">
        <div class="drop-container" id="container1">
            <div class="container-header">
                <div class="container-title">📋 To Do</div>
                <div class="container-subtitle">Drag items to organize</div>
            </div>
            <div class="items-grid" id="items1">
                <div class="drag-item" draggable="true">
                    <span class="item-icon">💡</span>
                    <div>Design Mockup</div>
                </div>
                <div class="drag-item" draggable="true">
                    <span class="item-icon">⚡</span>
                    <div>API Integration</div>
                </div>
                <div class="drag-item" draggable="true">
                    <span class="item-icon">🎨</span>
                    <div>UI Components</div>
                </div>
                <div class="drag-item" draggable="true">
                    <span class="item-icon">🔧</span>
                    <div>Bug Fixes</div>
                </div>
                <div class="drag-item" draggable="true">
                    <span class="item-icon">📊</span>
                    <div>Analytics</div>
                </div>
                <div class="drag-item" draggable="true">
                    <span class="item-icon">🚀</span>
                    <div>Deployment</div>
                </div>
            </div>
        </div>

        <div class="drop-container" id="container2">
            <div class="container-header">
                <div class="container-title">✅ Completed</div>
                <div class="container-subtitle">Finished tasks</div>
            </div>
            <div class="items-grid" id="items2">
                <div class="empty-state">
                    <div class="icon">📁</div>
                    <p>Drop completed items here</p>
                </div>
            </div>
        </div>
    </div>

    <div class="stats">
        <span id="stats-text">Ready to organize your tasks!</span>
    </div>

    <script>
        // JavaScript implementation will go here
        const containers = document.querySelectorAll('.drop-container');
        let draggedItem = null;
        let statsText = document.getElementById('stats-text');
        let totalItems = document.querySelectorAll('.drag-item').length;
        let completedItems = 0;
        let pendingItems = totalItems;
        const updateStats = () => {
            statsText.textContent = `${totalItems} total • ${completedItems} completed • ${pendingItems} pending`;
        };
        updateStats();

        document.querySelectorAll('.drag-item').forEach(item => {
            item.addEventListener('dragstart', () => {
                draggedItem = item;
                setTimeout(() => {
                    item.classList.add('dragging');
                }, 0);
            });

            item.addEventListener('dragend', () => {
                draggedItem = null;
                item.classList.remove('dragging');
            });
        });

        containers.forEach(container => {
            container.addEventListener('dragover', (e) => {
                e.preventDefault();
                container.classList.add('drag-over');
            });

            container.addEventListener('dragleave', () => {
                container.classList.remove('drag-over');
            });

            container.addEventListener('drop', () => {
                if (draggedItem) {
                    const itemsGrid = container.querySelector('.items-grid');
                    const emptyState = itemsGrid.querySelector('.empty-state');
                    if (emptyState) {
                        emptyState.remove();
                    }
                    itemsGrid.appendChild(draggedItem);
                    container.classList.remove('drag-over');

                    // Update stats
                    if (container.id === 'container2') {
                        completedItems++;
                        pendingItems--;
                    } else {
                        completedItems--;
                        pendingItems++;
                    }
                    updateStats();
                }
            });
        });

        updateStats();

        
    </script>
</body>
</html>
